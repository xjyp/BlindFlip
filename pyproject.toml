[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blindflip"
version = "1.0.0"
description = "Restricted-access preference reversal with surrogate-guided frozen portfolios"
requires-python = ">=3.10"
dependencies = ["tiktoken==0.12.0"]

[project.optional-dependencies]
local = ["vllm==0.20.2", "transformers==5.9.0"]

[project.scripts]
blindflip = "blindflip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
